<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Trading AI</title>
<style>
:root{font-family:Inter,system-ui,Arial;background:#070b14;color:#edf2f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111a30,#070b14 55%);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.brand{font-size:28px;font-weight:800}.sub{color:#8fa0b7}.badge{padding:8px 12px;border:1px solid #2d3950;border-radius:999px;background:#0d1422}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:rgba(12,18,31,.88);border:1px solid #1c2840;border-radius:18px;padding:18px;box-shadow:0 10px 30px #0003}.hero{grid-column:1/-1}.row{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#1c2a42;color:#fff;cursor:pointer}.btn.primary{background:#3b82f6}.btn.danger{background:#b4232f}.btn.good{background:#13795b}.btn:disabled{opacity:.45;cursor:not-allowed}select{background:#0b1220;color:#fff;border:1px solid #263550;padding:10px;border-radius:10px}.score{font-size:54px;font-weight:800}.signal{font-size:28px;font-weight:800}.muted{color:#8fa0b7}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #182235}.dangerText{color:#ff6b6b}.ok{color:#6ee7b7}.warn{color:#f1c75b}.events{max-height:280px;overflow:auto;font-size:13px}.event{padding:9px 0;border-bottom:1px solid #172238}.feed{margin-top:12px;padding:12px;border-radius:12px;background:#0a1220;border:1px solid #20304c}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">Nexus Trading AI</div><div class="sub">Confluence-first analysis · paper trading · no fabricated prices</div></div>
    <div class="badge" id="status">Checking service…</div>
  </div>
  <div class="grid">
    <div class="card hero">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div><div class="muted">Instrument</div><select id="symbol"><option>BTCUSD</option><option>ETHUSD</option><option>XAUUSD</option><option>EURUSD</option></select></div>
        <div><div class="muted">Signal score</div><div class="score" id="score">—</div></div>
        <div><div class="muted">Decision</div><div class="signal" id="decision">HOLD</div></div>
      </div>
      <div id="price" style="margin-top:14px;font-size:24px">—</div>
      <div id="feed" class="feed">Market feed not checked yet.</div>
      <div id="reasons" class="muted" style="margin-top:10px"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" onclick="analyze()">Analyze Market</button>
        <button class="btn good" id="execute" onclick="execute()">Execute Paper Trade</button>
        <button class="btn danger" onclick="kill()">Emergency Stop</button>
        <button class="btn" onclick="resetKill()">Reset Stop</button>
      </div>
    </div>
    <div class="card"><h3>Account</h3><div class="metric"><span>Balance</span><b id="balance">—</b></div><div class="metric"><span>Mode</span><b id="mode">—</b></div><div class="metric"><span>Live trading</span><b class="dangerText">Disabled</b></div><div class="metric"><span>Kill switch</span><b id="killState">—</b></div></div>
    <div class="card"><h3>Open position</h3><div id="position" class="muted">No position</div><button class="btn" style="margin-top:12px" onclick="closePos()">Close Paper Position</button></div>
    <div class="card"><h3>System events</h3><div id="events" class="events"></div></div>
  </div>
</div>
<script>
async function api(url,opts){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw new Error(j.detail||"Request failed");return j}
function money(x){return Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
async function refresh(){try{const s=await api('/api/state');document.getElementById('status').textContent=s.kill_switch?'EMERGENCY STOP':'ONLINE · PAPER';document.getElementById('balance').textContent='$'+money(s.balance);document.getElementById('mode').textContent=s.mode;document.getElementById('killState').textContent=s.kill_switch?'ACTIVE':'Ready';document.getElementById('killState').className=s.kill_switch?'dangerText':'ok';document.getElementById('execute').disabled=s.kill_switch||s.positions.length>0;document.getElementById('position').textContent=s.positions.length?(s.positions[0].side+' '+s.positions[0].symbol+' @ '+s.positions[0].entry):'No position';document.getElementById('events').innerHTML=s.events.map(e=>'<div class="event"><span class="muted">'+new Date(e.time).toLocaleTimeString()+'</span> · '+e.message+'</div>').join('')}catch(e){document.getElementById('status').textContent='SERVICE ERROR'}} 
async function analyze(){try{const x=await api('/api/analyze/'+document.getElementById('symbol').value);document.getElementById('score').textContent=x.score;document.getElementById('decision').textContent=x.direction;document.getElementById('price').textContent=x.price===null?'Price unavailable':'Price: '+x.price;document.getElementById('feed').innerHTML='<b>Feed:</b> '+x.source+' · <b>Status:</b> '+x.data_status;document.getElementById('feed').className='feed '+(x.data_status==='fresh'?'':'warn');document.getElementById('reasons').innerHTML=x.reasons.map(r=>'<div>'+r+'</div>').join('');await refresh()}catch(e){document.getElementById('feed').textContent=e.message;document.getElementById('feed').className='feed warn'}} 
async function execute(){try{await api('/api/execute/'+document.getElementById('symbol').value,{method:'POST'});await refresh()}catch(e){alert(e.message)}} 
async function closePos(){try{const x=await api('/api/close',{method:'POST'});alert('Paper P&L: '+x.pnl);await refresh()}catch(e){alert(e.message)}} 
async function kill(){await api('/api/kill',{method:'POST'});await refresh()} 
async function resetKill(){await api('/api/reset-kill',{method:'POST'});await refresh()} 
refresh();analyze();setInterval(refresh,15000);
</script>
</body>
</html>
